server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  retry:
    instances:
      pgRetry:
        max-attempts: 1
        wait-duration: 500ms
        retry-exceptions:
          - com.loopers.data.feign.RetryableException
        fail-after-max-attempts: true
      internalTaskRetry:
        max-attempts: 2
        expotentailBackoff:
          initialInterval: 500ms
          multiplier: 2
#        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException # Spring 추상화의 최상위 예외. 일시적인 데이터 처리 예외
          - jakarta.persistence.QueryTimeoutException # DB 쿼리가 지정된 시간 내에 완료되지 못한 경우
          - java.sql.SQLTransientConnectionException # JDBC 드라이버 수준에서 DB 연결에 일시적인 문제 발생
          - org.springframework.jdbc.CannotGetJdbcConnectionException # DB 연결 획득 실패했을 때
        fail-after-max-attempts: true
  circuitbreaker:
    instances:
      pgCircuit:
        recordExceptions:
          - com.loopers.data.feign.RetryableException
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 3s
        permitted-number-of-calls-in-half-open-state: 2
        slow-call-duration-threshold: 1s
        slow-call-rate-threshold: 50


---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false